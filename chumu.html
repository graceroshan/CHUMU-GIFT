<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali 🪔</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0015, #1a0033, #4b0082, #8b0000);
    background-size: 400% 400%;
    animation: bgShift 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ===== SPARKLE BACKGROUND (page 1) ===== */
  .sparkle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: gold;
    border-radius: 50%;
    box-shadow: 0 0 12px gold, 0 0 20px orange;
    animation: floatUp 6s linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  /* ===== CARD ===== */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 215, 0, 0.5);
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 0 40px rgba(255, 165, 0, 0.6);
    animation: popIn 0.8s ease;
  }

  @keyframes popIn {
    0%   { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: 2.6rem;
    color: gold;
    text-shadow: 0 0 15px orange, 0 0 30px red;
    margin-bottom: 15px;
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 15px orange, 0 0 25px red; }
    to   { text-shadow: 0 0 25px yellow, 0 0 45px orange; }
  }

  p.msg {
    color: #ffe;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  /* ===== BUTTON ===== */
  .btn {
    background: linear-gradient(45deg, #ff9900, #ff4500);
    color: white;
    border: none;
    padding: 16px 42px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 140, 0, 0.8);
    transition: all 0.3s ease;
    animation: pulse 1.5s infinite;
  }

  .btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(255, 200, 0, 1);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* ===== FIREWORKS CANVAS (full screen, behind everything) ===== */
  #fireworksCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    display: none; /* Page 1 pe hidden */
  }

  /* ===== GIFT SECTION (page 2) ===== */
  .gift-section {
    display: none;
    position: relative;
    z-index: 10;
    text-align: center;
    animation: popIn 1s ease;
    padding: 20px;
  }

  .gift-section img {
    max-width: 85vw;
    max-height: 60vh;
    border-radius: 20px;
    border: 4px solid gold;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.9), 0 0 80px rgba(255, 100, 0, 0.5);
    animation: photoReveal 1.2s ease;
    position: relative;
    z-index: 12;
  }

  @keyframes photoReveal {
    0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .gift-text {
    color: gold;
    font-size: 1.6rem;
    margin-top: 20px;
    text-shadow: 0 0 15px orange;
    animation: glow 2s infinite alternate;
    position: relative;
    z-index: 12;
  }

  /* ===== HIDE CLASS ===== */
  .hide { display: none !important; }

  /* ===== MOBILE ===== */
  @media (max-width: 500px) {
    h1 { font-size: 2rem; }
    .gift-text { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<!-- Sparkles (page 1 background) -->
<div id="sparkles"></div>

<!-- Fireworks canvas (page 2) -->
<canvas id="fireworksCanvas"></canvas>

<!-- MAIN WELCOME CARD (Page 1) -->
<div class="card" id="welcomeCard">
  <h1>🪔Happy Diwali🪔</h1>
  <p class="msg">
    Pyari sali,<br>HAPPY DIWALI<BR.
    Is Diwali par tumhare liye ek <b>special surprise</b> hai! 🎁<br><br>
    Neeche wale button ko dabao aur dekho...
  </p>
  <button class="btn" onclick="revealGift()">🎁 OPEN Your Gift 🎁</button>
</div>

<!-- GIFT SECTION (Page 2) -->
<div class="gift-section" id="giftSection">
  <img src="chumu.jpeg" alt="Diwali Gift">
  <p class="gift-text">✨ Ye raha tumhara gift! ✨</p>
</div>

<!-- BACKGROUND SONG (tumhara set kiya hua) -->
<audio id="diwaliSong" loop>
  <source src="chumu.mpeg" type="audio/mpeg">
</audio>

<script>
/* ================================================================
   1. PAGE 1 SPARKLES
   ================================================================ */
const sparkleBox = document.getElementById('sparkles');
for (let i = 0; i < 40; i++) {
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.animationDelay = Math.random() * 6 + 's';
  s.style.animationDuration = (4 + Math.random() * 5) + 's';
  sparkleBox.appendChild(s);
}

/* ================================================================
   2. MAIN REVEAL FUNCTION
   ================================================================ */
function revealGift() {
  // Page 1 hide
  document.getElementById('welcomeCard').classList.add('hide');
  document.getElementById('sparkles').style.display = 'none';

  // Page 2 show
  document.getElementById('giftSection').style.display = 'block';

  // Fireworks canvas ON
  const canvas = document.getElementById('fireworksCanvas');
  canvas.style.display = 'block';
  startFireworks();

  // Tumhara gaana play
  const song = document.getElementById('diwaliSong');
  song.volume = 0.85; // thoda kam taaki boom sounds sunai de
  song.play().catch(err => console.log("Song blocked:", err));

  // Boom/cracker sounds start
  startCrackerSounds();
}

/* ================================================================
   3. FIREWORKS ENGINE (Canvas based)
   ================================================================ */
const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');

let particles = [];
let rockets = [];
let fireworksRunning = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Particle (explosion ka ek tukda)
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.015 + 0.008;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05; // gravity
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.alpha -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Rocket (upar jaane wala cracker)
class Rocket {
  constructor(x, targetY) {
    this.x = x;
    this.y = canvas.height;
    this.targetY = targetY;
    this.vy = -(Math.random() * 4 + 10);
    this.color = randomColor();
    this.trail = [];
  }
  update() {
    this.trail.push({ x: this.x, y: this.y, alpha: 1 });
    if (this.trail.length > 8) this.trail.shift();
    this.trail.forEach(t => t.alpha -= 0.1);

    this.y += this.vy;
    this.vy *= 0.99;

    if (this.y <= this.targetY || this.vy > -1) {
      this.explode();
      return false; // remove rocket
    }
    return true;
  }
  draw() {
    // trail
    this.trail.forEach(t => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, t.alpha);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    // rocket head
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  explode() {
    const count = 60 + Math.floor(Math.random() * 40);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(this.x, this.y, this.color));
    }
    // Secondary color burst
    for (let i = 0; i < 20; i++) {
      particles.push(new Particle(this.x, this.y, randomColor()));
    }
    // Crack sound
    playCrackSound();
  }
}

function randomColor() {
  const colors = [
    '#ff0040', '#ff4500', '#ffcc00', '#00ff88',
    '#00ccff', '#ff00ff', '#ffff00', '#ff6600',
    '#66ff00', '#ff1493', '#00ffff'
  ];
  return colors[Math.floor(Math.random() * colors.length)];
}

// Animation loop
function animateFireworks() {
  if (!fireworksRunning) return;

  // Trail effect (screen fade)
  ctx.fillStyle = 'rgba(10, 0, 21, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Update rockets
  rockets = rockets.filter(r => r.update());
  rockets.forEach(r => r.draw());

  // Update particles
  particles = particles.filter(p => p.alpha > 0);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  requestAnimationFrame(animateFireworks);
}

// Random rocket launch
function launchRandomRocket() {
  if (!fireworksRunning) return;
  const x = Math.random() * canvas.width;
  const targetY = Math.random() * (canvas.height * 0.5) + 50;
  rockets.push(new Rocket(x, targetY));
}

function startFireworks() {
  fireworksRunning = true;
  animateFireworks();

  // Continuous rockets
  setInterval(launchRandomRocket, 600);

  // Initial burst
  for (let i = 0; i < 3; i++) {
    setTimeout(launchRandomRocket, i * 300);
  }
}

/* ================================================================
   4. CRACKER SOUNDS (Web Audio API - no files needed!)
   ================================================================ */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// "Boom" / cracker sound generate karta hai
function playCrackSound() {
  if (!audioCtx) return;

  const now = audioCtx.currentTime;

  // 1. Low boom (bass thump)
  const osc = audioCtx.createOscillator();
  const oscGain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
  oscGain.gain.setValueAtTime(0.4, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc.connect(oscGain);
  oscGain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.4);

  // 2. Noise burst (crackle)
  const bufferSize = audioCtx.sampleRate * 0.3;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'highpass';
  noiseFilter.frequency.value = 1000;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.15, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  noise.start(now);
}

// Extra random background cracker sounds
function startCrackerSounds() {
  initAudio();

  // Har 1.5 - 3 sec mein random boom
  function scheduleNext() {
    const delay = 1500 + Math.random() * 1500;
    setTimeout(() => {
      if (!fireworksRunning) return;
      playCrackSound();
      scheduleNext();
    }, delay);
  }
  scheduleNext();
}

/* ================================================================
   5. Page visibility - pause when tab hidden (battery saving)
   ================================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    fireworksRunning = false;
  } else if (document.getElementById('giftSection').style.display === 'block') {
    fireworksRunning = true;
    animateFireworks();
  }
});
</script>

</body>
</html>
